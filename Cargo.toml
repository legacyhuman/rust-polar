[package]
name = "rust-polar"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Local Polar AccessLink archive"
license = "MIT OR Apache-2.0"

[lib]
name = "rust_polar"
path = "src/lib.rs"

[[bin]]
name = "rust-polar"
path = "src/main.rs"

[dependencies]
blake3 = "1.8"
bytes = "1.12"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1.7", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "tls12", "webpki-tokio"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "service", "tokio"] }
libc = "0.2"
redb = "4.4.0"
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "=0.0.2-alpha"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["arbitrary_precision"] }
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "net", "rt", "signal", "sync", "time"] }
